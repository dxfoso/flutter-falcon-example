name: flutter_falcon_example
description: Minimal Flutter Falcon test app.
publish_to: 'none'
version: 2.0.6+107

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_falcon:
    git:
      url: https://github.com/dxfoso-org/flutterfalcon.git
      ref: ef5a64057dbd9691ae8882c96afc70f55998d143
      path: flutter_falcon
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.5.3

flutter_falcon:
  required_build_variables:
    - API_BASE_URL
flutter:
  uses-material-design: true
