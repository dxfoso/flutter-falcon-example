    sdk: flutter
  flutter_falcon:
    git:
      url: https://github.com/dxfoso/flutterfalcon.git
      ref: 25d3467
      path: flutter_falcon
  flutter_falcon_android_direct:
    git:
      url: https://github.com/dxfoso/flutterfalcon.git
