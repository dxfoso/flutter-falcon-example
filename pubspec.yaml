name: flutter_falcon_example
description: Minimal Flutter Falcon test app.
publish_to: 'none'
version: 2.0.1+102

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_falcon:
    git:
      url: https://github.com/dxfoso/flutterfalcon.git
      ref: 9d7df0e1059ac39c3cacb2d2f32d3be94633e369
      path: flutter_falcon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.5.3

flutter_falcon:
  required_build_variables:
    - API_BASE_URL
flutter:
  uses-material-design: true
