name: red_rect_app
description: Minimal Flutter Falcon test app.
publish_to: 'none'
version: 1.0.1+2

flutter_falcon:
  variables:
    FLUTTER_FALCON_SERVER_URL: https://flutterfalcon.com
    FLUTTER_FALCON_APP_ID: com.example.red_rect_app
    FLUTTER_FALCON_PLATFORM: windows-x64
