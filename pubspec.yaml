name: flutter_falcon_example
description: Minimal Flutter Falcon test app.
publish_to: 'none'
version: 2.0.5+106

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_falcon:
    git:
      url: https://github.com/dxfoso-org/flutterfalcon.git
      ref: cd6b25dec0b9d0ef4ce065858fcd9873e4f86947
      path: flutter_falcon
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.5.3

flutter_falcon:
  required_build_variables:
    - API_BASE_URL
flutter:
  uses-material-design: true
